<!doctype html>
<!--
  Chat overlay. Add as an OBS Browser Source:
    http://localhost:8080/overlays/chat.html?username=YOURNAME
  Options: &max=12 (messages shown)  &fade=30 (seconds before fading, 0 = never)
           &joins=1 (show joins)  &gifts=1 (show finished gifts)  &follows=1
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>tiklive chat</title>
  <style>
    :root { --bg: rgba(16, 16, 22, 0.72); --name: #7fdcff; --text: #fff; --muted: #b8b8c8; }
    html, body { margin: 0; background: transparent; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    #chat { position: fixed; inset: auto 16px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border-radius: 14px;
           background: var(--bg); color: var(--text); font-size: 20px; line-height: 1.3;
           animation: pop .25s ease-out; transition: opacity .6s; }
    .msg.fade { opacity: 0; }
    .msg img.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; }
    .msg .name { color: var(--name); font-weight: 700; margin-right: 6px; }
    .msg.system { color: var(--muted); font-size: 17px; }
    .msg.gift .name { color: #ffd166; }
    .badge { font-size: 12px; padding: 1px 6px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; background: #3a3a55; }
    .badge.mod { background: #2f8f46; } .badge.sub { background: #8f2f7c; }
    @keyframes pop { from { transform: translateY(12px); opacity: 0; } }
  </style>
</head>
<body>
  <div id="chat"></div>
  <script type="module">
    import { TikLive } from '/tiklive.js';

    const params = new URLSearchParams(location.search);
    const max = Number(params.get('max') ?? 12);
    const fade = Number(params.get('fade') ?? 30);
    const flag = (k) => params.get(k) === '1';
    const chat = document.getElementById('chat');

    const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    function add(user, html, cls = '') {
      const el = document.createElement('div');
      el.className = `msg ${cls}`;
      const badges = (user.isModerator ? '<span class="badge mod">MOD</span>' : '') +
                     (user.isSubscriber ? '<span class="badge sub">SUB</span>' : '');
      el.innerHTML = `<img class="avatar" src="${esc(user.profilePictureUrl || '')}" onerror="this.style.visibility='hidden'">
        <div>${badges}<span class="name">${esc(user.nickname || user.uniqueId)}</span>${html}</div>`;
      chat.append(el);
      while (chat.children.length > max) chat.firstElementChild.remove();
      if (fade > 0) setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 700); }, fade * 1000);
    }

    const events = ['chat', 'emote'];
    if (flag('joins')) events.push('join');
    if (flag('gifts')) events.push('gift');
    if (flag('follows')) events.push('follow');

    const live = new TikLive({ events, replay: true });
    live.on('chat', (e) => add(e.user, esc(e.comment)));
    live.on('emote', (e) => add(e.user, e.emotes.map((m) => `<img src="${esc(m.imageUrl)}" height="28">`).join(' ')));
    live.on('join', (e) => add(e.user, 'joined', 'system'));
    live.on('follow', (e) => add(e.user, 'followed!', 'system'));
    live.on('gift', (e) => { if (!e.streaking) add(e.user, `sent ${esc(e.giftName)} ×${e.repeatCount}`, 'gift'); });
  </script>
</body>
</html>
