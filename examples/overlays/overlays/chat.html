<!doctype html>
<!--
  Chat overlay. Add as an OBS Browser Source:
    http://localhost:8080/overlays/chat.html?username=YOURNAME
  Options: &max=12 (messages shown)  &fade=30 (seconds before fading, 0 = never)
           &joins=1 (show joins)  &gifts=1 (show finished gifts)  &follows=1 (show follows)
           &token=… if the server requires one
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>tiklive chat</title>
    <style>
      :root {
        --bg: rgba(16, 16, 22, 0.72);
        --name: #7fdcff;
        --text: #fff;
        --muted: #b8b8c8;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #chat {
        position: fixed;
        inset: auto 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 14px;
        background: var(--bg);
        color: var(--text);
        font-size: 20px;
        line-height: 1.3;
        animation: pop 0.25s ease-out;
        transition: opacity 0.6s;
      }
      .msg.fade {
        opacity: 0;
      }
      .msg img.avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex: none;
      }
      .msg .name {
        color: var(--name);
        font-weight: 700;
        margin-right: 6px;
      }
      .msg.system {
        color: var(--muted);
        font-size: 17px;
      }
      .msg.gift .name {
        color: #ffd166;
      }
      .msg img.gift-img {
        height: 1.4em;
        vertical-align: middle;
        margin: 0 4px;
      }
      .badge {
        font-size: 12px;
        padding: 1px 6px;
        border-radius: 6px;
        margin-right: 6px;
        vertical-align: 2px;
        background: #3a3a55;
      }
      .badge.mod {
        background: #2f8f46;
      }
      .badge.sub {
        background: #8f2f7c;
      }
      @keyframes pop {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="chat"></div>
    <script type="module">
      import { TikLive } from "/tiklive.js";

      const params = new URLSearchParams(location.search);
      // Numeric option with a default; a missing or non-numeric value falls back to `def`.
      const numParam = (k, def) =>
        params.has(k) && Number.isFinite(Number(params.get(k))) ? Number(params.get(k)) : def;
      const max = numParam("max", 12);
      const fade = numParam("fade", 30);
      const flag = (k) => params.get(k) === "1";
      const chat = document.getElementById("chat");

      // Only http(s) URLs may reach an <img>; anything else renders as nothing.
      const safeUrl = (u) => {
        try {
          const url = new URL(String(u ?? ""));
          return url.protocol === "http:" || url.protocol === "https:" ? url.href : "";
        } catch {
          return "";
        }
      };

      function img(src, props = {}) {
        const url = safeUrl(src);
        if (!url) return null;
        const node = document.createElement("img");
        Object.assign(node, props, { src: url, referrerPolicy: "no-referrer" });
        node.addEventListener("error", () => {
          node.style.visibility = "hidden";
        });
        return node;
      }

      function badge(text, cls) {
        const node = document.createElement("span");
        node.className = `badge ${cls}`;
        node.textContent = text;
        return node;
      }

      // `content` is a list of strings and/or nodes; strings are inserted as text.
      function add(user, content, cls = "") {
        const el = document.createElement("div");
        el.className = `msg ${cls}`;
        const avatar = img(user?.profilePictureUrl, { className: "avatar" });
        const body = document.createElement("div");
        if (user?.isModerator) body.append(badge("MOD", "mod"));
        if (user?.isSubscriber) body.append(badge("SUB", "sub"));
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = user?.nickname || user?.uniqueId || "";
        body.append(name, ...content);
        el.append(...(avatar ? [avatar] : []), body);
        chat.append(el);
        while (chat.children.length > max) chat.firstElementChild.remove();
        if (fade > 0)
          setTimeout(() => {
            el.classList.add("fade");
            setTimeout(() => el.remove(), 700);
          }, fade * 1000);
        return el;
      }

      const events = ["chat", "emote", "chatDelete"];
      if (flag("joins")) events.push("join");
      if (flag("gifts")) events.push("gift");
      if (flag("follows")) events.push("follow");

      const live = new TikLive({ events, replay: true });
      live.on("chat", (e) => {
        const el = add(e.user, [e.comment ?? ""]);
        if (e.msgId) el.dataset.msgId = e.msgId;
      });
      live.on("chatDelete", (e) => {
        const deleted = new Set(e.msgIds);
        for (const el of chat.querySelectorAll(".msg[data-msg-id]")) {
          if (deleted.has(el.dataset.msgId)) el.remove();
        }
      });
      live.on("emote", (e) =>
        add(
          e.user,
          (e.emotes ?? []).flatMap((m) => [img(m.imageUrl, { height: 28 }), " "]),
        ),
      );
      live.on("join", (e) => add(e.user, ["joined"], "system"));
      live.on("follow", (e) => add(e.user, ["followed!"], "system"));
      live.on("gift", (e) => {
        if (e.streaking) return;
        const icon = img(e.giftImageUrl, { className: "gift-img", alt: e.giftName ?? "" });
        add(e.user, [`sent ${e.giftName ?? ""}`, icon ?? " ", `×${Number(e.repeatCount) || 0}`], "gift");
      });
    </script>
  </body>
</html>
