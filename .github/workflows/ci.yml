name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Bun version from package.json
        id: bun
        run: echo "version=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? '1.4.3'")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx vp lint

  test-bun:
    name: Tests (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Bun version from package.json
        id: bun
        run: echo "version=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? '1.4.3'")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run test

  test-node:
    name: Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read Bun version from package.json
        id: bun
        run: echo "version=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? '1.4.3'")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run test:node

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read Bun version from package.json
        id: bun
        run: echo "version=$(node -p "require('./package.json').packageManager?.split('@')[1] ?? '1.4.3'")" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - run: bun install --frozen-lockfile
      - run: bun run build
