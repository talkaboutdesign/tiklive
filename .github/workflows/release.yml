name: Release

# Runs only when started by hand (Actions → Release → Run workflow on main).
# With pending changesets, changesets/action opens or updates a
# "Release: version packages" PR. After that PR is merged, run the workflow
# again to stage the new versions on npm (a maintainer approves them with 2FA)
# and create a GitHub Release.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push version commits, tags and GitHub Releases
  pull-requests: write # open the version PR
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read Bun version from package.json
        id: bun-version
        run: echo "version=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run release --stage
          title: "Release: version packages"
          commit: "Release: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub Release
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version packages/server/package.json)
          # Release notes: this version's section of the server changelog.
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' packages/server/CHANGELOG.md > notes.md
          git tag "v$version" && git push origin "v$version"
          gh release create "v$version" --title "v$version" --notes-file notes.md
