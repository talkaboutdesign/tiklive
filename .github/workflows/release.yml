name: Release

# Two channels, both from main, with no approvals:
#
# - Nightly: at most every six hours, on a schedule, when main has new commits
#   since the last nightly and pending changesets (merging a PR doesn't build
#   one by itself, like T3 Code). CI runs first. The
#   changesets are versioned as a snapshot (0.6.0-nightly.20261012173210)
#   without committing anything, `tiklive` is published under the npm
#   `nightly` dist-tag, the desktop app is built, and the commit gets a GitHub
#   prerelease with the installers and nightly*.yml update files.
# - Stable: Actions → Release → Run workflow, channel "stable". Promotes the
#   latest nightly: on that nightly's commit it runs `changeset version`,
#   merges the version commit into main, publishes `tiklive` to `latest`,
#   builds the desktop app (release-desktop.yml) and creates the vX.Y.Z GitHub
#   Release with the installers attached. Commits merged after that nightly
#   wait for the next one.
#
# Run it with channel "nightly" to build a nightly of main right away, for
# example to retry a failed one.

on:
  schedule:
    # Hourly, off the busy top of the hour. The gate job decides whether a nightly is due.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [nightly, stable]
        default: nightly

# Stable has its own group, so a newer nightly never replaces a queued stable run.
concurrency:
  group: release-${{ inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: false

# Read-only by default. Each job asks for what its steps need below, so only the
# jobs that push or publish get write access, and only they get id-token.
permissions:
  contents: read

jobs:
  # Scheduled runs only: a nightly is due when the last one is at least six hours old
  # and main has moved since. Manual runs skip this and always build.
  gate:
    name: Nightly due?
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # history and tags
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_GAP_SECONDS: 21600
        run: |
          set -euo pipefail
          last=$(gh release list --limit 50 --json tagName,publishedAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^v.*-nightly\\.")))] | sort_by(.publishedAt) | last | .tagName // ""')
          if [[ -z "$last" ]]; then
            echo "No nightly yet."
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          published=$(gh release view "$last" --json publishedAt --jq .publishedAt)
          age=$(( $(date +%s) - $(date -d "$published" +%s) ))
          if (( age < MIN_GAP_SECONDS )); then
            echo "$last is $(( age / 60 )) minutes old. Waiting for the six-hour gap."
            echo "due=false" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor HEAD "$last"; then
            echo "Nothing merged since $last."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since $last."
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: gate
    if: ${{ !cancelled() && !failure() && inputs.channel != 'stable' && (github.event_name != 'schedule' || needs.gate.outputs.due == 'true') }}
    permissions:
      contents: read # ci.yml is read-only, and a called workflow can't get more than its caller grants
    uses: ./.github/workflows/ci.yml

  nightly:
    name: Nightly
    needs: ci
    # Scheduled runs act as whoever last changed the cron line, which is the owner. The
    # `release` environment (which holds the secrets and the npm trusted publisher) allows only main.
    if: ${{ !cancelled() && needs.ci.result == 'success' && inputs.channel != 'stable' && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read # checkout, build and npm publish. Nothing is pushed.
      id-token: write # npm trusted publishing (OIDC) + provenance
      pull-requests: read # changelog-github looks up the PRs in the release range
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Bun version from package.json
        id: bun-version
        run: echo "version=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned, not @latest, to the newest 11.x
      # that is at least three days old (11.21.0, published 2026-09-30).
      - run: npm install -g npm@11.21.0

      - run: bun install --frozen-lockfile

      - name: Version
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }} # @changesets/changelog-github looks up PRs
        run: |
          set -euo pipefail
          if [[ -z "$(find .changeset -name '*.md' ! -name README.md)" ]]; then
            echo "No pending changesets, so there is nothing to release."
            exit 0
          fi
          bun run changeset version --snapshot nightly
          echo "version=$(jq -r .version packages/server/package.json)" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version
        run: bun run build

      - if: steps.version.outputs.version
        run: bun run release

      # The snapshot's changelog isn't committed, so the notes travel as an artifact.
      - name: Write release notes
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/server/CHANGELOG.md > notes.md

      - if: steps.version.outputs.version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: notes.md

  stable:
    name: Stable
    if: inputs.channel == 'stable' && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    permissions:
      contents: write # pushes the version commit to main, then the tag
      id-token: write # npm trusted publishing (OIDC) + provenance
      pull-requests: read # changelog-github looks up the PRs in the release range
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0 # history and tags

      - name: Read Bun version from package.json
        id: bun-version
        run: echo "version=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Pinned, not @latest, to the newest 11.x
      # that is at least three days old (11.21.0, published 2026-09-30).
      - run: npm install -g npm@11.21.0

      # The nightly's CI run already tested this commit. The version commit
      # only changes versions and changelogs, so it's committed and merged into
      # main before anything is published: if main can't take it, nothing ships.
      - name: Version the latest nightly
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }} # @changesets/changelog-github looks up PRs
        run: |
          set -euo pipefail
          nightly=$(git tag --list 'v*-nightly.*' --sort=-v:refname | head -n 1)
          if [[ -z "$nightly" ]]; then
            echo "::error::No nightly to promote. Merge a change with a changeset into main first."
            exit 1
          fi
          version=${nightly#v}
          version=${version%%-*}
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::$nightly was already released as v$version. Merge a new change to get a new nightly."
            exit 1
          fi

          if [[ "$(jq -r .version packages/server/package.json)" == "$version" ]]; then
            # An earlier run committed this version but didn't finish releasing it.
            sha=$(git log -1 --format=%H --grep="^Release: v$version\$")
            echo "Resuming the release of v$version from $sha"
          else
            echo "Promoting $nightly ($(git rev-parse "$nightly^{commit}"))"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --detach "$nightly"
            bun install --frozen-lockfile
            bun run version-packages
            git add -A
            git commit -m "Release: v$version"
            sha=$(git rev-parse HEAD)
            # Fast-forwards when nothing landed after the nightly.
            git switch main
            git merge --no-edit -m "Merge release v$version into main" "$sha"
            git push origin main
          fi
          git switch --detach "$sha"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run build
      # Skips the package if this version is already on npm.
      - run: bun run release

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/server/CHANGELOG.md > notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes
          path: notes.md

  # Both channels. A version's prerelease suffix makes electron-builder write
  # nightly*.yml instead of latest*.yml, which is how the app tells them apart.
  desktop:
    name: Desktop
    needs: [nightly, stable]
    if: ${{ !failure() && !cancelled() && (needs.nightly.outputs.version != '' || needs.stable.outputs.version != '') }}
    permissions:
      contents: read # release-desktop.yml only builds and uploads artifacts
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.nightly.outputs.version || needs.stable.outputs.version }}
      ref: ${{ needs.nightly.outputs.version && needs.nightly.outputs.sha || needs.stable.outputs.sha }}
    secrets: inherit

  # Created only once every installer is built, like t3code: the desktop
  # app's updater reads the latest release, so it must never see one without
  # its latest*.yml files.
  # Nightlies are prereleases, never marked latest: the stable channel reads
  # the latest release, the nightly channel the newest nightly prerelease.
  github-release:
    name: GitHub Release
    needs: [nightly, stable, desktop]
    if: ${{ !failure() && !cancelled() && needs.desktop.result == 'success' }}
    permissions:
      contents: write # pushes the vX.Y.Z tag and creates the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.nightly.outputs.version || needs.stable.outputs.version }}
      NIGHTLY: ${{ needs.nightly.outputs.version != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.nightly.outputs.version && needs.nightly.outputs.sha || needs.stable.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION" && git push origin "v$VERSION"
          if [[ "$NIGHTLY" == "true" ]]; then
            gh release create "v$VERSION" --prerelease --latest=false --title "v$VERSION" --notes-file notes.md release-assets/*
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md release-assets/*
          fi
