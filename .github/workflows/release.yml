name: Release

# Every push to main ships. Merging is the release decision; nothing waits for
# an approval.
#
# 1. CI (ci.yml) runs against the pushed commit.
# 2. With pending changesets, `changeset version` bumps the version and writes
#    the changelog, and the result is committed straight to main as
#    "Release: vX.Y.Z".
# 3. `tiklive` is published to npm (trusted publishing, OIDC) if its version
#    isn't there yet. A push without changesets publishes nothing.
# 4. The desktop app is built (release-desktop.yml), then the vX.Y.Z GitHub
#    Release is created with its installers and updater files attached.
#
# Run it by hand (Actions → Release → Run workflow on main) only to retry a
# failed publish: with no pending changesets it publishes whatever version on
# main isn't on npm yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push version commits, tags and GitHub Releases
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Version and publish
    needs: ci
    # Only the repository owner can push to main, and the `release` environment
    # (which holds the secrets and the npm trusted publisher) allows only main.
    if: github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # The tip of main, not the pushed commit: runs are queued one at a time,
      # and an earlier run may have added a version commit since this push.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read Bun version from package.json
        id: bun-version
        run: echo "version=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      # Committed and pushed before publishing: if main moved in the meantime
      # the push fails and nothing is published.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [[ -n "$(find .changeset -name '*.md' ! -name README.md)" ]]; then
            bun run version-packages
            version=$(jq -r .version packages/server/package.json)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Release: v$version"
            git push origin HEAD:main
          else
            echo "No pending changesets."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - run: bun run build

      - name: Publish
        id: publish
        run: |
          set -euo pipefail
          bun run release | tee release.log
          echo "version=$(jq -r .version packages/server/package.json)" >> "$GITHUB_OUTPUT"
          if grep -q '^New tag:' release.log; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Desktop
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.sha }}
    secrets: inherit

  # Created only once every installer is built, like t3code: the desktop
  # app's updater reads the latest release, so it must never see one without
  # its latest*.yml files.
  github-release:
    name: GitHub Release
    needs: [release, desktop]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # Release notes: this version's section of the server changelog.
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' packages/server/CHANGELOG.md > notes.md
          git tag "v$VERSION" && git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md release-assets/*
